<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; frame-ancestors 'none';">
  <title>Eva AI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="gradient gradient-1"></div>
  <div class="gradient gradient-2"></div>

  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="logo"><i class="fa-solid fa-sparkles"></i></div>
      </div>
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue with Eva AI</p>

      <div id="auth-error" class="auth-error" style="display:none"></div>

      <input type="email" id="email" placeholder="Email" autocomplete="email">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">

      <button onclick="login()" id="login-btn">
        <span id="login-text">Sign In</span>
        <i id="login-spinner" class="fa-solid fa-circle-notch fa-spin" style="display:none"></i>
      </button>

      <p class="auth-footer">
        No account? <a href="signup.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</body>
</html>
